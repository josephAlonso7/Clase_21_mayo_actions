name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML5 structure
        run: |
          npm install -g htmlhint
          echo '{ "doctype-first": true, "tag-pair": true, "title-require": true, "attr-lowercase": true, "attr-value-double-quotes": true }' > .htmlhintrc
          htmlhint index.html
